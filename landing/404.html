  <style>
    .error-layout {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .error-box {
      max-width: 520px;
      padding: 48px 32px;
      background: var(--bg-surface);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
    }
    .error-code {
      font-size: 5rem;
      font-family: var(--font-mono);
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <main class="error-layout">
    <div class="error-box">
      <div class="error-code">404</div>
      <h1 style="font-size: 1.75rem; margin-bottom: 12px;">Sayfa Bulunamadı</h1>
      <p style="color: var(--text-secondary); margin-bottom: 28px; line-height: 1.6;">
        Aradığınız dokümantasyon sayfası veya bağlantı taşınmış, adı değiştirilmiş ya da silinmiş olabilir.
      </p>
      <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
        <a href="/" class="btn btn-primary">← Ana Sayfaya Dön</a>
        <a href="docs/" class="btn btn-secondary">Dokümantasyon</a>
      </div>
    </div>
  </main>
